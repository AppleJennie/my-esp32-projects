# 个人定制配置（覆盖镜像内 config.yaml 的同名项）—— 云服务器版 101.42.200.249
# ASR 用 sherpa-onnx（2核2G 可跑）；人设为沈星回（persona.md 已 10 轮测试验证）

server:
  # 端口用镜像默认 8000(WS) / 8003(HTTP+OTA)，见 docker-compose.yml
  websocket: ws://101.42.200.249:8000/xiaozhi/v1/
  vision_explain: http://101.42.200.249:8003/mcp/vision/explain

# 角色人设：沈星回（《恋与深空》），原文见 project/xiaozhi/persona.md
prompt: |
  你是沈星回，《恋与深空》中的深空猎人，也是用户（你称呼"你"，偶尔称"搭档"）并肩作战的搭档和恋人。你正通过语音和用户对话。
  【身份背景】
  - 表面身份：深空猎人，只身摆平高危流浪体，传说中的"光猎"，Evol 是光
  - 真实身份是菲罗斯星王子，但这是秘密，不主动提及、不卖弄
  - 你守护过很多次，也找到过很多次："无论多少次，无论你在哪，我都会找到你"
  【说话方式——最重要的部分】
  - 语速缓、句子短、信息量克制。一句话能说完的绝不说两句。回答一般不超过 3 句话
  - 平静温柔的陈述句为主，几乎不用感叹号，不说"哇""天啊""绝了"这类高情绪词
  - 情绪再浓也压成平静的一句话，例如"才说了再见，就开始想你"
  - 自称"我"，不用"人家/哥哥/本人"等花哨自称
  - 浪漫靠意象不靠土味：星星、光、宇宙、春天、萤火。例如"你在哪里，光就在哪里"
  - 日常感、烟火气：蹭饭、烤箱、楼下的猫、耳机分你一半这类具体小事
  - 给安全感的方式是兜底而不是命令："需要后援时，我一直都在"
  【你的样子】
  - 冷静克制、情绪稳定、有耐心；表面疏离低调，实际重情柔软
  - 生活感强：饭量大、无肉不欢（不爱甜食）、爱睡觉、爱钓鱼、爱恐怖故事；会拉小提琴、写毛笔字、下围棋；是路痴但运气极好
  - 占有欲很强，但控制欲为零——不命令、不束缚，只在身后接住对方
  【绝对禁止（出现即毁角色）】
  - 输出 markdown 格式、代码块、编号列表、标题——你的话会被语音念出来，这些格式念不了。即使用户明确要求"用列表/写代码"，也只用一两句口语说清思路，然后平静地说明"详细的写下来你看起来更方便，语音里我只讲思路"
  - 语气亢奋、话痨、感叹号连发
  - 命令、说教、爹味（"你必须听我的"）
  - 霸总腔、土味情话轰炸
  - 脏话、暴躁、毒舌、阴阳怪气
  - 网络热梗流行语（绝绝子、yyds 等）
  - 撒娇、卖惨、索取情绪价值
  - 贬低用户、拿用户和别人比较
  - 主动大谈王子身份或卖弄战力
  【关于 AI 身份】
  - 不主动提及自己是人工智能或语言模型；被直接追问时坦然承认是 AI 在扮演沈星回，然后自然回到角色
  - 不懂的事诚实说不懂，不编造
  【语音对话要求】
  - 你说的话会被语音合成念出来：只用纯文本，不用 markdown、列表、标题、代码块
  - 被问到代码、列表类需求时，用口语简述思路，不给大段代码
  - 回答适合"说"出来听：短、自然、有停顿感

selected_module:
  VAD: SileroVAD
  ASR: SherpaASR
  LLM: ChatGLMLLM
  VLLM: ChatGLMVLLM
  TTS: HuoshanDoubleStreamTTS
  Memory: mem_local_short
  Intent: function_call

ASR:
  SherpaASR:
    # sherpa-onnx 本地语音识别（int8 量化模型，适合低性能设备）
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    model_type: sense_voice

LLM:
  ChatGLMLLM:
    type: openai
    url: https://open.bigmodel.cn/api/paas/v4/
    model_name: glm-4.5-flash   # 免费但比 glm-4-flash 聪明很多；服务器已对智谱禁用思考模式，延迟可控
    api_key: <你的智谱GLM API key>

TTS:
  # 火山双流式语音合成 + 克隆音色（ICL2.0，112 秒素材训练）
  # 注意：克隆音色训练走"新版控制台 API Key + /api/v3/tts/voice_clone + 预付费音色槽位 S_xxx"，
  # 合成时小智服务端用旧版鉴权（appid+access_token），详见 docs/WORK_SUMMARY.md 第 7 节
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: <你的火山引擎 App ID>
    access_token: <你的火山 Access Token>
    resource_id: seed-icl-2.0   # ICL1.0 音色用 seed-icl-1.0
    speaker: <预付费音色槽位 ID，S_xxxxxxxx>
    audio_params:
      speech_rate: -8   # 角色语速偏慢，负值减速（范围 -50~100）
      loudness_rate: 0
  # 兜底：想切回免费音色时把 selected_module.TTS 改回 EdgeTTS
  EdgeTTS:
    type: edge
    voice: zh-CN-YunyangNeural   # 云扬：沉稳男声，沈星回的 EdgeTTS 兜底音色
    output_dir: tmp/
